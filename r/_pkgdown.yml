url: https://randsley.github.io/dataeuropa/r/

template:
  bootstrap: 5
  light-switch: true
  bslib:                  # the palette and fonts of the landing page; font files in pkgdown/extra.css
    primary: "#1C6B66"
    link-color: "#1C6B66"
    body-bg: "#F5F8F7"
    body-color: "#17242B"
    border-color: "#D3DDDA"
    code-color: "#17242B"
    pre-bg: "#EBF1EF"
    navbar-bg: "#17242B"
    base_font: "Schibsted Grotesk"
    heading_font: "Schibsted Grotesk"
    code_font: "JetBrains Mono"

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, all-languages, github, lightswitch]
  components:
    all-languages:
      text: All languages
      href: https://randsley.github.io/dataeuropa/
    github:
      icon: fa-github
      href: https://github.com/randsley/dataeuropa
      aria-label: GitHub

articles:
  - title: Guides
    navbar: ~
    contents:
      - articles/getting-started
      - articles/examples

reference:
  - title: Search
    contents:
      - de_search_datasets
      - de_search
      - de_fetch_datasets
      - de_count
      - de_facet_values
  - title: Datasets and files
    contents:
      - de_get_dataset
      - de_distributions
      - de_download
      - de_load_distribution
      - de_load_geodata
      - de_cache_on
      - de_catalogues
  - title: Linked data
    contents:
      - de_get_rdf
      - de_sparql
  - title: Helpers
    contents:
      - de_pick_lang
      - dataeuropa-package
