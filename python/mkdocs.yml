site_name: dataeuropa (Python)
site_description: Python client for the data.europa.eu open data portal
site_url: https://randsley.github.io/dataeuropa/python/
repo_url: https://github.com/randsley/dataeuropa
edit_uri: edit/main/python/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
  font: false             # fonts come from stylesheets/dataeuropa.css, not Google Fonts
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-4, name: Light mode}

extra_css:
  - stylesheets/dataeuropa.css

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Worked examples: examples.md
  - Reference: reference.md
  - All languages: https://randsley.github.io/dataeuropa/

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]
