name: Docs

# Builds the three documentation sites and the landing page into one GitHub Pages site:
#   /         pages/index.html
#   /python/  mkdocs (python/mkdocs.yml)
#   /julia/   Documenter.jl (julia/docs/make.jl)
#   /r/       pkgdown (r/_pkgdown.yml)
# Pull requests only build (to catch broken docs); pushes to main also deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "./python[docs]"
      - run: mkdocs build --strict -f python/mkdocs.yml -d "$GITHUB_WORKSPACE/out/python"
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-python
          path: out/python

  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - run: julia --project=julia/docs -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=julia/docs julia/docs/make.jl
      - uses: actions/upload-artifact@v4
        with:
          name: docs-julia
          path: julia/docs/build

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::pkgdown, local::.
          needs: website
      - run: Rscript -e 'pkgdown::build_site("r", override = list(destination = file.path(Sys.getenv("GITHUB_WORKSPACE"), "out/r")), preview = FALSE, install = FALSE, new_process = FALSE)'
      - uses: actions/upload-artifact@v4
        with:
          name: docs-r
          path: out/r

  # Assemble the three sites and the landing page into the Pages artifact.
  site:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [python, julia, r]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docs-python
          path: site/python
      - uses: actions/download-artifact@v4
        with:
          name: docs-julia
          path: site/julia
      - uses: actions/download-artifact@v4
        with:
          name: docs-r
          path: site/r
      - run: cp pages/index.html site/index.html && touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # A separate job, as GitHub recommends: deploy-pages run in the same job as the upload sometimes
  # did not yet see the new artifact ("No artifacts named github-pages were found").
  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
