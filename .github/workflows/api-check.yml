name: API check

# Weekly check that data.europa.eu still offers what the three clients rely on: the query
# parameters they send (against the published OpenAPI spec) and the response fields they read
# (against live data). See tools/check_api.py. A failed scheduled run emails the repo owner.
on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/check_api.py
      - tools/api_baseline.json
      - .github/workflows/api-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests pyyaml
      - run: python tools/check_api.py
