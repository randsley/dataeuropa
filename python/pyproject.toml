[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dataeuropa"
version = "0.1.0"
description = "Python client for the data.europa.eu open data portal (Search API, Registry, SPARQL)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
test = ["pytest", "pandas"]
docs = ["mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["live: hits the real data.europa.eu API (deselect with -m 'not live')"]
