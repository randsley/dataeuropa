[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dataeuropa"
version = "0.1.0"
description = "Python client for the data.europa.eu open data portal (Search API, Registry, SPARQL)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nigel Randsley", email = "nigel.randsley@protonmail.com" }]
keywords = ["open data", "data.europa.eu", "European data portal", "DCAT-AP", "SPARQL", "geodata"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/randsley/dataeuropa"
Documentation = "https://randsley.github.io/dataeuropa/python/"
Issues = "https://github.com/randsley/dataeuropa/issues"
Changelog = "https://github.com/randsley/dataeuropa/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
xlsx = ["pandas>=1.5", "openpyxl>=3.1"]
parquet = ["pandas>=1.5", "pyarrow>=14"]
geo = ["pandas>=1.5", "geopandas>=0.14", "pyogrio>=0.7"]
test = ["pytest", "pandas", "openpyxl", "pyarrow", "geopandas", "pyogrio"]
docs = ["mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["live: hits the real data.europa.eu API (deselect with -m 'not live')"]
